#sub_path_only rewrite ^__PATH__$ __PATH__/ permanent;
location __PATH__/ {

  access_log /var/log/nginx/__APP__-access.log;
  error_log /var/log/nginx/__APP__-error.log;

  proxy_pass http://127.0.0.1:__PORT__;

  include proxy_params_no_auth;
  proxy_set_header X-Remote-Port $remote_port;

  # We expect the downsteam servers to redirect to the right hostname, so don't do any rewrite$
  proxy_redirect     off;
}
